<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>use-eye</title>
  </head>
  <body>
    <div id="app" class="stage">
      <video id="viewfinder" playsinline autoplay muted></video>

      <div class="frame-marks" id="marks" aria-hidden="true">
        <span class="mark tl"></span>
        <span class="mark tr"></span>
        <span class="mark bl"></span>
        <span class="mark br"></span>
      </div>

      <header class="rail rail-top">
        <div class="tally-wrap">
          <span class="tally" id="tally"></span>
          <span class="tally-label" id="tally-label">idle</span>
        </div>
        <script>
          // Boot marker: flips as soon as HTML parses. If you still see "idle"
          // the module bundle never ran (check the certificate and the console).
          // If you see "boot" and nothing else, the module failed to load.
          document.getElementById("tally-label").textContent = "boot";
        </script>
        <div class="readout" id="readout">
          <span id="read-dims">&mdash;</span>
          <span class="sep"></span>
          <span id="read-facing">rear</span>
        </div>
      </header>

      <div class="hint" id="hint"></div>

      <footer class="rail rail-bottom">
        <div class="controls">
          <button class="ctl" id="btn-torch" type="button" aria-label="Toggle torch">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 3h10v3.2l-2.4 2.6v9.6a2.6 2.6 0 0 1-5.2 0V8.8L7 6.2V3Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <button class="ctl ctl-main" id="btn-flip" type="button" aria-label="Switch camera">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 9a8 8 0 0 1 13.7-4.2M20 15a8 8 0 0 1-13.7 4.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <path d="M4 4v5h5M20 20v-5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <button class="ctl" id="btn-pause" type="button" aria-label="Pause stream">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-pause">
              <path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-play" hidden>
              <path d="M8 5.5 18 12 8 18.5Z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </footer>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-inner">
          <p class="sheet-kicker">connection</p>
          <p class="sheet-url" id="sheet-url"></p>
          <p class="sheet-note" id="sheet-note"></p>
          <button class="sheet-close" id="sheet-close" type="button">close</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
